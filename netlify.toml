[build]
  publish = "public"
  functions = "netlify/functions"
  # Marker-armed one-shot helper (no-op when unarmed; never fails the build):
  # send-test-email sends one Resend test.
  command = "node scripts/send-test-email.mjs"

[functions]
  node_bundler = "esbuild"

# Scheduled function — Netlify cron runs in UTC.
# Australia/Perth is UTC+8 year-round (no daylight saving), so:
#   Friday 08:00 Perth  = Friday   00:00 UTC  ->  "0 0 * * 5"   (payment reminders)
[functions."reminders-cron"]
  schedule = "0 0 * * 5"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
